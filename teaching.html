<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teaching | Advanced Combustion Laboratory</title>

    <link rel="stylesheet" href="assets/styles.css">

    <style>
        .teaching-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 55px 35px;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-top: 25px;
        }

        .course-box {
            border: 1px solid #d9e0e7;
            border-radius: 4px;
            padding: 30px 25px;
            background-color: #f5f7f9;
            text-align: center;
        }

        .course-box h2 {
            color: #002d56;
            font-size: 20px;
            margin: 0 0 10px;
        }

        .course-box p {
            color: #536779;
            margin: 0 0 22px;
        }

        .syllabus-link {
            display: inline-block;
            background-color: #002d56;
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 3px;
            text-decoration: none;
            font-weight: 600;
        }

        .syllabus-link:hover {
            background-color: #28649b;
            color: #ffffff;
        }

        @media (max-width: 700px) {
            .course-grid {
                grid-template-columns: 1fr;
            }

            .teaching-section {
                padding: 40px 25px;
            }
        }
    </style>
</head>

<body>

    <main>
        <section class="teaching-section">

            <p>Select a course below to view its syllabus.</p>

            <div class="course-grid">

                <div class="course-box">
                    <h2>EML4930 / EML5131: Combustion</h2>
                    <p>Spring 2027</p>

                    <a class="syllabus-link"
                       href="assets/combustion_spring_2027.pdf"
                       target="_blank"
                       rel="noopener noreferrer">
                        View Syllabus (PDF)
                    </a>
                </div>

                <div class="course-box">
                    <h2>EAS4132 / EML5714: Compressive Flow</h2>
                    <p>Spring 2026</p>

                    <a class="syllabus-link"
                       href="assets/compressible_flow_spring_2026.pdf"
                       target="_blank"
                       rel="noopener noreferrer">
                        View Syllabus (PDF)
                    </a>
                </div>

            </div>

        </section>
    </main>

    <footer class="site-footer">
        <p>
            Advanced Combustion Laboratory |
            University of Florida
        </p>
    </footer>

</body>
</html>
