function escapeHTML(text) {
    return text.replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[char];
    });
}

function formatCitation(text) {
    let result = escapeHTML(text);

    // Bold C. Grégoire, wherever it appears in the author list.
    result = result.replace(/C\.\s*Grégoire/g,
        "<strong>C. Grégoire</strong>");

    // Bold publication year.
    result = result.replace(/\((20\d{2})\)/g,
        "(<strong>$1</strong>)");

    // Italicize venue names, longest first.
    venues.slice().sort((a,b) => b.length - a.length)
        .forEach(function(venue) {
            const safeVenue = escapeHTML(venue);
            result = result.replaceAll(safeVenue,
                "<em>" + safeVenue + "</em>");
        });

    // Make DOI links clickable.
    result = result.replace(
        /DOI:\s*(10\.[^\s<]+)/g,
        function(match, doi) {
            return 'DOI: <a href="https://doi.org/' + doi +
                '" target="_blank" rel="noopener noreferrer">' +
                'https://doi.org/' + doi + '</a>';
        }
    );

    return result;
}

function renderPublications(entries, listId) {
    const list = document.getElementById(listId);

    entries.forEach(function(entry) {
        const separator = entry.indexOf("|");
        const number = entry.slice(0, separator);
        const citation = entry.slice(separator + 1);

        const item = document.createElement("li");
        item.className = "publication-entry";
        item.innerHTML =
            '<span class="entry-number">' + number + '.</span> ' +
            formatCitation(citation);

        list.appendChild(item);
    });
}

renderPublications(journal, "journal-list");
renderPublications(conference, "conference-list");

// Independent Read More / Read Less buttons.
document.querySelectorAll(".read-toggle").forEach(function(button) {
    button.addEventListener("click", function() {
        const list = document.getElementById(button.dataset.list);
        const expanded = list.classList.toggle("expanded");

        button.textContent = expanded ? "Read Less" : "Read More";
        button.setAttribute("aria-expanded", String(expanded));
    });
});
